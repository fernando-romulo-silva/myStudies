<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anybank</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container">
      <h1 class="titulo">Cadastro</h1>
      <p class="subtitulo">Preencha os campos abaixo para criar sua conta</p>
      <form id="cadastro-form" class="cadastro-form">
        <fieldset class="campo-formulario">
          <label for="nome">Nome completo:</label>
          <input id="nome" name="nome" type="text" required minlength="3" />
          <span class="mensagem-erro"></span>
        </fieldset>
        <fieldset class="campo-formulario">
          <label for="cpf">CPF:</label>
          <input
            id="cpf"
            name="cpf"
            type="number"
            required
            minlength="11"
            maxlength="14"
          />
          <span class="mensagem-erro"></span>
        </fieldset>
        <fieldset class="campo-formulario">
          <label for="idade">Idade:</label>
          <input id="idade" name="idade" type="number" required />
          <span class="mensagem-erro"></span>
        </fieldset>
        <fieldset class="campo-formulario">
          <label for="senha">Senha:</label>
          <input id="senha" name="senha" type="text" required minlength="8" />
          <span class="mensagem-erro"></span>
        </fieldset>
        <button type="submit">Cadastrar</button>
      </form>
    </div>
    <script src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
